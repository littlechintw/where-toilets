<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="臺灣廁所地圖">
  <!-- 深色圓角方塊（site CTA 同色，跟 navbar 風格一致） -->
  <rect width="64" height="64" rx="14" fill="#0f172a"/>

  <!-- 外圈淺紫底 pin，做出多層次 -->
  <path d="M32 11C22.61 11 15 18.61 15 28c0 12.5 14.5 25.6 17 25.6S49 40.5 49 28c0-9.39-7.61-17-17-17z"
        fill="#a5b4fc"/>

  <!-- 內圈白色 pin head -->
  <circle cx="32" cy="27" r="10" fill="#ffffff"/>

  <!-- 深色廁所剪影（馬桶側視）：水箱（圓角矩形） + 馬桶座（橢圓） -->
  <!-- 水箱 -->
  <rect x="27" y="20" width="10" height="6" rx="1.6" fill="#0f172a"/>
  <!-- 馬桶座（兩側內縮的梯形 + 底部橢圓） -->
  <path d="M25 26h14l-1.5 5h-11z" fill="#0f172a"/>
  <ellipse cx="32" cy="32" rx="6.5" ry="2.2" fill="#0f172a"/>
</svg>
