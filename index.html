  <!-- Google Fonts
       文字字型用 display=optional：首次載入若字型沒在約 100ms 內就緒就直接用系統字型，

  <!-- Google Analytics 4 (gtag.js) -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    window.gtag = gtag;
    gtag('js', new Date());
    // 先停用自動 page_view，改由 SPA router 手動追蹤，避免重複計算
    gtag('config', 'G-ZLLZ3Q6YKT', {
      send_page_view: false,
      anonymize_ip: true
    });
    // gtag.js 本體約 180KB，延後到瀏覽器閒置或第一次互動才載入；
    // 在那之前呼叫 gtag() 的事件都先排在 dataLayer，載入後會一併送出，不會漏
    (function () {
      var loaded = false;
      function load() {
        if (loaded) return;
        loaded = true;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-ZLLZ3Q6YKT';
        document.head.appendChild(s);
      }
      ['pointerdown', 'keydown', 'scroll', 'touchstart'].forEach(function (name) {
        window.addEventListener(name, load, { once: true, passive: true });
      });
      if ('requestIdleCallback' in window) requestIdleCallback(load, { timeout: 3000 });
      else setTimeout(load, 3000);
    })();
  </script>
