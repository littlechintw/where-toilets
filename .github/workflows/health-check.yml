name: Health Check

on:
  # Schedule: Run once a day at 6:00 UTC
  schedule:
    - cron: '0 6 * * *'
  
  # Manual Trigger
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    
    steps:
    - name: Check website status
      run: |
        echo "🔍 Checking website health status..."
        
        # Check the main page
        if curl -f -s -o /dev/null "https://toilets.littlechin.tw/"; then
          echo "✅ Main page is accessible."
        else
          echo "❌ Main page is not accessible."
          exit 1
        fi
        
        # Check the map page
        if curl -f -s -o /dev/null "https://toilets.littlechin.tw/map"; then
          echo "✅ Map page is accessible."
        else
          echo "⚠️ Map page might have issues (this is normal for SPA routing)."
        fi
        
        # Check the data index file
        if curl -f -s -o /dev/null "https://toilets.littlechin.tw/data/index.json"; then
          echo "✅ Data index file is accessible."
        else
          echo "❌ Data index file is not accessible."
          exit 1
        fi
        
        echo "🎉 Health check complete."
    
    - name: Check data freshness
      run: |
        echo "📅 Checking data freshness..."
        
        # Download the index file to check the last updated timestamp
        curl -s "https://toilets.littlechin.tw/data/index.json" > index.json
        
        if [[ -f index.json ]]; then
          # Use jq to reliably parse the JSON and extract the last_updated value
          last_updated=$(jq -r '.last_updated' index.json)
          
          echo "📊 Data last updated at: $last_updated"

          # Check if the data is older than 10 days
          if [[ -n "$last_updated" ]]; then
            last_timestamp=$(date -d "$last_updated" +%s 2>/dev/null || echo "0")
            current_timestamp=$(date +%s)
            days_diff=$(( (current_timestamp - last_timestamp) / 86400 ))
            
            echo "📈 Data is $days_diff days old."
            
            if [[ $days_diff -gt 10 ]]; then
              echo "⚠️ Data is older than 10 days. Please check the auto-update workflow."
            else
              echo "✅ Data freshness is normal."
            fi
          fi
        fi