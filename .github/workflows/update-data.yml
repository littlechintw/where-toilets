name: Update Toilet Data

on:
  # Schedule: Run every Sunday at 00:00 UTC
  schedule:
    - cron: '0 0 * * 0'
  
  # Manual Trigger
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force update data'
        required: false
        default: false
        type: boolean

# Set permissions
permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Create data directory
      run: mkdir -p public/data
    
    - name: Fetch toilet data
      env:
        MOENV_API_KEY: ${{ secrets.MOENV_API_KEY }}
      run: node scripts/fetch-toilets.js
    
    - name: Normalize data
      run: node scripts/normalize-data.js
    
    - name: List generated files
      run: |
        echo "📂 Generated data files:"
        ls -lh public/data/ || echo "No data directory found"
    
    - name: Create deployment flag
      run: |
        echo "{\"updated_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"trigger_deploy\": true}" > public/data/deploy-flag.json
        echo "✅ Deployment flag created"
    
    - name: Check for data changes
      id: check-changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # Add all changes to check them
        git add public/data/
        
        # Check if there are any staged changes
        if git diff --cached --quiet HEAD -- public/data/; then
          echo "❌ No data changes detected"
          echo "changes=false" >> $GITHUB_OUTPUT
        else
          echo "✅ Data changes detected"
          echo "changes=true" >> $GITHUB_OUTPUT
          
          # Display the changed files
          echo "Changed files:"
          git diff --cached --name-only HEAD -- public/data/
          
          echo ""
          echo "File changes summary:"
          git diff --cached --stat HEAD -- public/data/
        fi
    
    - name: Commit and push data changes
      if: steps.check-changes.outputs.changes == 'true' || github.event.inputs.force_update == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        git add public/data/
        
        # Check if there are any changes to commit
        if git diff --cached --quiet; then
          echo "⚠️ No changes to commit"
          
          # If force_update is true, create an empty commit to trigger deployment
          if [[ "${{ github.event.inputs.force_update }}" == "true" ]]; then
            echo "🔄 Creating empty commit to trigger deployment..."
            git commit --allow-empty -m "chore(data): Force deploy trigger - $(date +'%Y-%m-%d %H:%M:%S')"
          fi
        else
          git commit -m "feat(data): Auto-update toilet data - $(date +'%Y-%m-%d %H:%M:%S')"
        fi
        
        echo "🚀 Pushing changes to repository..."
        git push origin main || git push origin HEAD:main
    
    - name: Verify changes were pushed
      if: steps.check-changes.outputs.changes == 'true' || github.event.inputs.force_update == 'true'
      run: |
        echo "🔍 Verifying remote repository..."
        git fetch origin
        LOCAL=$(git rev-parse HEAD)
        REMOTE=$(git rev-parse origin/main)
        
        if [ "$LOCAL" = "$REMOTE" ]; then
          echo "✅ Changes successfully pushed to remote repository"
        else
          echo "⚠️ Warning: Local and remote commits differ"
          echo "Local:  $LOCAL"
          echo "Remote: $REMOTE"
        fi
    
    - name: Output summary
      run: |
        if [[ "${{ steps.check-changes.outputs.changes }}" == "true" || "${{ github.event.inputs.force_update }}" == "true" ]]; then
          echo "✅ Data updated, which will trigger website deployment."
          echo "📝 View the latest commit: https://github.com/${{ github.repository }}/commit/$(git rev-parse HEAD)"
        else
          echo "ℹ️ No data changes, skipping deployment."
        fi